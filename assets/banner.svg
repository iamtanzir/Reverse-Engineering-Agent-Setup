<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="REA - Reverse Engineer Anything: MCP server and investigation skill for your coding agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1a"/>
      <stop offset="0.55" stop-color="#111c3a"/>
      <stop offset="1" stop-color="#080d1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d6ff"/>
      <stop offset="0.5" stop-color="#8a6bff"/>
      <stop offset="1" stop-color="#ff4f92"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38d6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38d6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#0a1022"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>

  <!-- decorative grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 40H1280M0 80H1280M0 120H1280M0 160H1280M0 200H1280M0 240H1280M0 280H1280"/>
    <path d="M80 0V300M160 0V300M240 0V300M320 0V300M400 0V300M480 0V300M560 0V300M640 0V300M720 0V300M800 0V300M880 0V300M960 0V300M1040 0V300M1120 0V300M1200 0V300"/>
  </g>

  <!-- glows -->
  <circle cx="1060" cy="60" r="330" fill="url(#glow)"/>
  <circle cx="120" cy="300" r="280" fill="url(#glow2)"/>

  <!-- left accent bracket -->
  <path d="M44 52V36H60" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M44 248V264H60" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

  <!-- title -->
  <text x="76" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="800" letter-spacing="6" fill="url(#accent)">REA</text>

  <!-- wordmark -->
  <text x="80" y="182" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="7.5" fill="#eef2ff">REVERSE ENGINEER ANYTHING</text>

  <!-- subtitle -->
  <text x="81" y="228" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9db0d4">MCP server + investigation skill for your coding agent</text>

  <!-- terminal panel -->
  <rect x="742" y="66" width="472" height="168" rx="14" fill="url(#panel)" stroke="#2b3d68" stroke-width="1.5"/>
  <rect x="742" y="66" width="472" height="34" rx="14" fill="#141f3c"/>
  <rect x="742" y="86" width="472" height="14" fill="#141f3c"/>
  <circle cx="766" cy="83" r="5" fill="#ff5f57"/>
  <circle cx="784" cy="83" r="5" fill="#febc2e"/>
  <circle cx="802" cy="83" r="5" fill="#28c840"/>
  <text x="880" y="88" font-family="Consolas,'SFMono-Regular',Menlo,monospace" font-size="12" fill="#7d8fb3" text-anchor="middle">rea · terminal</text>

  <g font-family="Consolas,'SFMono-Regular',Menlo,monospace" font-size="15.5">
    <text x="766" y="132" fill="#8a6bff">$</text>
    <text x="786" y="132" fill="#dfe7ff">npx rea-agents@latest setup</text>
    <text x="766" y="164" fill="#3ddc97">✓</text>
    <text x="790" y="164" fill="#c7d3ee">MCP connection registered</text>
    <text x="766" y="192" fill="#3ddc97">✓</text>
    <text x="790" y="192" fill="#c7d3ee">Investigation skill installed</text>
    <text x="766" y="220" fill="#38d6ff">›</text>
    <text x="786" y="220" fill="#7d8fb3">ready to inspect anything</text>
  </g>

  <!-- bottom strip -->
  <rect x="0" y="294" width="1280" height="6" fill="url(#accent)"/>
</svg>
